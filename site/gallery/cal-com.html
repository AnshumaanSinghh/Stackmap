/** CSS custom properties for both themes, scoped to `scope`. */
function themeCss(scope, mode) {
  const vars = (t) => Object.entries(t).map(([k, v]) => `--sm-${k}:${v};`).join('');
  if (mode === 'light' || mode === 'dark') return `${scope}{${vars(THEMES[mode])}}`;
  return (
    `${scope}{${vars(THEMES.light)}}` +
    `@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) ${scope}{${vars(THEMES.dark)}}}` +
    `:root[data-theme="dark"] ${scope}{${vars(THEMES.dark)}}`

}

  cms: '<path d="M7 3h7l4 4v14H7V3z"/><path d="M14 3v4h4M10 12h5M10 16h5"/>',
  flags: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  realtime: '<circle cx="12" cy="12" r="2"/><path d="M8 8a5.5 5.5 0 0 0 0 8M16 8a5.5 5.5 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/>',
  workflow: '<rect x="3" y="4" width="6" height="5" rx="1"/><rect x="15" y="15" width="6" height="5" rx="1"/><path d="M6 9v4a2 2 0 0 0 2 2h7"/><path d="M13 13l2 2-2 2"/>',
  cloud: '<path d="M7 18.5h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.1 9.6 4.5 4.5 0 0 0 7 18.5z"/>',
  integrations: '<path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0V7zM12 16v5"/>',
  external: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
};

function iconFor(node) {
  if (node.kind === 'datastore' || node.kind === 'external') return ICONS[node.category] ?? ICONS.external;
  return ICONS[node.kind] ?? ICONS.service;
}

// Turns the full graph into what gets drawn. Shared by Node renderers and the browser viewer,
// so it must stay free of imports and Node APIs.
//
// "Services" view (default): internal libraries that other units depend on are folded into
// the apps and services that use them. If apps/web depends on packages/db, and packages/db
// uses PostgreSQL, the map draws web -> PostgreSQL "through db". Nothing is lost: the edge
// keeps the original evidence.

function viewGraph(graph, opts) {
  const options = opts || {};
  const showLibraries = Boolean(options.libraries);
  const byId = new Map(graph.nodes.map((n) => [n.id, n]));
  const dependents = new Map();
  for (const e of graph.edges) {
    if (e.kind === 'depends' && byId.get(e.to) && byId.get(e.to).kind === 'library') {
      dependents.set(e.to, (dependents.get(e.to) || 0) + 1);
    }
  }
  const hidden = new Set();
  if (!showLibraries) {
    const touched = new Set();
    for (const e of graph.edges) {
      touched.add(e.from);
      touched.add(e.to);
    }
    // Fold used libraries into their users; drop unconnected ones from this view.
    for (const n of graph.nodes) if (n.kind === 'library' && (dependents.get(n.id) || !touched.has(n.id))) hidden.add(n.id);
  }
  // Copy edges (and their arrays) so folding never writes back into the graph.
  const copy = (e) => Object.assign({}, e, { via: e.via.slice(), evidence: e.evidence.slice(), through: e.through ? e.through.slice() : undefined });
  if (hidden.size === 0) return { nodes: graph.nodes.slice(), edges: graph.edges.map(copy), hidden: 0 };

  const out = new Map();
  for (const e of graph.edges) {
    if (!out.has(e.from)) out.set(e.from, []);
    out.get(e.from).push(e);
  }
  const edges = new Map();
  for (const e of graph.edges) if (!hidden.has(e.from) && !hidden.has(e.to)) edges.set(e.id, copy(e));

  const rank = { inferred: 1, declared: 2, configured: 3, imported: 4 };
  for (const n of graph.nodes) {
    if (hidden.has(n.id)) continue;
    // Breadth-first through hidden libraries reachable from this visible node.
    // `entry` is the evidence for the first hop (this node -> the library it imports):
    // the line to change if the lifted connection is unwanted.
    const seen = new Set();
    const queue = [];
    for (const e of out.get(n.id) || []) if (e.kind === 'depends' && hidden.has(e.to) && !seen.has(e.to)) {
      seen.add(e.to);
      queue.push([e.to, e.evidence.slice(0, 2)]);
    }
    while (queue.length) {
      const item = queue.shift();
      const lib = item[0];
      const entry = item[1];
      const libName = byId.get(lib).name;
      for (const e of out.get(lib) || []) {
        if (hidden.has(e.to)) {
          if (e.kind === 'depends' && !seen.has(e.to)) {
            seen.add(e.to);
            queue.push([e.to, entry]);
          }
          continue;
        }
        if (e.to === n.id) continue;
        // Lift connections to infrastructure and backends only. A shared package importing
        // code from an app is a code-level detail, not an architectural connection.
        const target = byId.get(e.to);
        if (target && (target.column === 'apps' || target.column === 'libraries')) continue;
        const id = n.id + '->' + e.to;
        let lifted = edges.get(id);
        if (!lifted) {
          lifted = { id, from: n.id, to: e.to, kind: e.kind, via: e.via.slice(), through: [], confidence: e.confidence, declaredOnly: e.declaredOnly, evidence: e.evidence.slice(), evidenceCount: e.evidenceCount || e.evidence.length, lifted: true, entry };
          edges.set(id, lifted);
        } else {
          if (!lifted.through) lifted.through = [];
          if (rank[e.confidence] > rank[lifted.confidence]) lifted.confidence = e.confidence;
          lifted.declaredOnly = lifted.declaredOnly && e.declaredOnly;
          for (const v of e.via) if (lifted.via.indexOf(v) === -1) lifted.via.push(v);
          if (lifted.evidence.length < 6) for (const ev of e.evidence) if (lifted.evidence.length < 6 && !lifted.evidence.some((x) => x.file === ev.file && x.line === ev.line)) lifted.evidence.push(ev);
        }
        if (lifted.through && lifted.through.indexOf(libName) === -1) lifted.through.push(libName);
      }
    }
  }
  return { nodes: graph.nodes.filter((n) => !hidden.has(n.id)), edges: Array.from(edges.values()), hidden: hidden.size };
}

/** Everything connected to `id` (one hop), for focus mode and `stackmap why`. */
function neighbours(view, id) {
  const ids = new Set([id]);
  for (const e of view.edges) {
    if (e.from === id) ids.add(e.to);
    if (e.to === id) ids.add(e.from);
  }
  return ids;
}

/** Nodes that (transitively) depend on `id`: what breaks if it goes down. */
function impactOf(graph, id) {
  const incoming = new Map();
  for (const e of graph.edges) {
    if (!incoming.has(e.to)) incoming.set(e.to, []);
    incoming.get(e.to).push(e);
  }
  const seen = new Map();
  const queue = [[id, 0]];
  while (queue.length) {
    const [cur, depth] = queue.shift();
    for (const e of incoming.get(cur) || []) {
      if (seen.has(e.from) || e.from === id) continue;
      seen.set(e.from, { depth: depth + 1, via: cur, edge: e });
      queue.push([e.from, depth + 1]);
    }
  }
  return seen;
}

// Column layout for the map: Apps | Services & workers | Libraries | Data | Third-party.
// Order inside columns uses the barycenter heuristic to reduce edge crossings; data and
// third-party nodes are grouped by category. Shared by the SVG renderer and the browser viewer,
// so it must stay free of imports and Node APIs.

const LAYOUT = { nodeW: 216, nodeH: 54, gapY: 12, colGap: 150, subColGap: 36, headerH: 24, groupGap: 16, pad: 40, titleH: 40 };

const COLUMNS = [
  { key: 'apps', title: 'Apps' },
  { key: 'services', title: 'Services & workers' },
  { key: 'libraries', title: 'Libraries' },
  { key: 'data', title: 'Data' },
  { key: 'external', title: 'Third-party' },
];

const SERVICE_KIND_ORDER = { service: 0, function: 1, container: 2, worker: 3, cli: 4 };

function layoutGraph(view, opts) {
  const L = Object.assign({}, LAYOUT, opts || {});
  const colIndex = new Map(COLUMNS.map((c, i) => [c.key, i]));
  const cols = new Map(COLUMNS.map((c) => [c.key, []]));
  for (const n of view.nodes) (cols.get(n.column) || cols.get('services')).push(n);

  // Adjacency (undirected) for barycenters.
  const adj = new Map(view.nodes.map((n) => [n.id, []]));
  for (const e of view.edges) {
    if (adj.has(e.from) && adj.has(e.to)) {
      adj.get(e.from).push(e.to);
      adj.get(e.to).push(e.from);
    }
  }
  const colOf = new Map();
  for (const [k, list] of cols) for (const n of list) colOf.set(n.id, k);

  // Initial order.
  cols.get('apps').sort(byName);
  cols.get('services').sort((a, b) => (SERVICE_KIND_ORDER[a.kind] || 9) - (SERVICE_KIND_ORDER[b.kind] || 9) || byName(a, b));
  cols.get('libraries').sort(byName);
  for (const k of ['data', 'external']) cols.get(k).sort((a, b) => String(a.category).localeCompare(String(b.category)) || byName(a, b));

  const pos = new Map();
  const refreshPos = () => {
    for (const [, list] of cols) list.forEach((n, i) => pos.set(n.id, list.length > 1 ? i / (list.length - 1) : 0.5));
  };
  refreshPos();
  const bary = (n) => {
    const ns = adj.get(n.id).filter((id) => colOf.get(id) !== colOf.get(n.id));
    if (!ns.length) return pos.get(n.id);
    return ns.reduce((s, id) => s + pos.get(id), 0) / ns.length;
  };
  const order = ['apps', 'services', 'libraries', 'data', 'external'];
  for (let iter = 0; iter < 8; iter++) {
    const seq = iter % 2 === 0 ? order : order.slice().reverse();
    for (const k of seq) {
      const list = cols.get(k);
      if (list.length < 2) continue;
      const b = new Map(list.map((n) => [n.id, bary(n)]));
      if (k === 'data' || k === 'external') {
        const groups = new Map();
        for (const n of list) {
          const g = n.category || 'other';
          if (!groups.has(g)) groups.set(g, []);
          groups.get(g).push(n);
        }
        const gs = Array.from(groups.values()).map((members) => {
          members.sort((x, y) => b.get(x.id) - b.get(y.id) || byName(x, y));
          return { members, score: members.reduce((s, n) => s + b.get(n.id), 0) / members.length };
        });
        gs.sort((x, y) => x.score - y.score || String(x.members[0].category).localeCompare(String(y.members[0].category)));
        cols.set(k, gs.flatMap((g) => g.members));
      } else {
        list.sort((x, y) => b.get(x.id) - b.get(y.id) || byName(x, y));
      }
      refreshPos();
    }
  }

  // Wrap long columns into sub-columns.
  const total = view.nodes.length;
  const maxRows = Math.max(12, Math.min(20, Math.ceil(Math.sqrt(total) * 1.7)));
  const rowH = L.nodeH + L.gapY;
  const boxes = new Map();
  const groups = [];
  const columns = [];
  let x = L.pad;
  const colHeights = [];

  for (const c of COLUMNS) {
    const list = cols.get(c.key);
    if (!list.length) continue;
    const grouped = c.key === 'data' || c.key === 'external';
    // Build rows: each item is a node or a group header.
    const items = [];
    let prevCat = null;
    for (const n of list) {
      if (grouped && n.category !== prevCat) {
        items.push({ header: n.categoryLabel || n.category || 'Other', category: n.category });
        prevCat = n.category;
      }
      items.push({ node: n });
    }
    const heightOf = (it) => (it.header ? L.headerH + (L.groupGap / 2) : rowH);
    const maxH = maxRows * rowH;
    const sub = [[]];
    let h = 0;
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      const ih = heightOf(it);
      // Keep a header with at least one node.
      const need = it.header ? ih + rowH : ih;
      if (h + need > maxH && sub[sub.length - 1].length) {
        sub.push([]);
        h = 0;
        if (!it.header && grouped) {
          // Continue the group under a repeated header.
          const lastHeader = findLastHeader(items, i);
          if (lastHeader) {
            sub[sub.length - 1].push({ header: lastHeader.header + ' (cont.)', category: lastHeader.category, cont: true });
            h += heightOf(lastHeader);
          }
        }
      }
      sub[sub.length - 1].push(it);
      h += ih;
    }
    const colX = x;
    const colW = sub.length * L.nodeW + (sub.length - 1) * L.subColGap;
    let colH = 0;
    sub.forEach((items2, si) => {
      let y = 0;
      const sx = colX + si * (L.nodeW + L.subColGap);
      for (const it of items2) {
        if (it.header) {
          if (y > 0) y += L.groupGap / 2;
          groups.push({ label: it.header, category: it.category, x: sx, y, w: L.nodeW, column: c.key });
          y += L.headerH;
        } else {
          boxes.set(it.node.id, { x: sx, y, w: L.nodeW, h: L.nodeH });
          y += rowH;
        }
      }
      colH = Math.max(colH, y - L.gapY);
    });
    columns.push({ key: c.key, title: c.title, x: colX, w: colW, h: colH, count: list.length });
    colHeights.push(colH);
    x += colW + L.colGap;
  }

  // Centre each column vertically under the title row.
  const contentH = Math.max(L.nodeH, ...colHeights, 0);
  const top = L.pad + L.titleH;
  for (const col of columns) {
    const dy = top + Math.round((contentH - col.h) / 2);
    col.y = dy;
    for (const [id, b] of boxes) if (colOf.get(id) === col.key) b.y += dy;
    for (const g of groups) if (g.column === col.key && !g.shifted) {
      g.y += dy;
      g.shifted = true;
    }
  }
  const width = Math.max(x - L.colGap + L.pad, 320);
  const height = top + contentH + L.pad;

  const edges = routeEdges(view.edges, boxes, colOf, colIndex);
  return { width, height, boxes, groups, columns, edges, L };
}

function findLastHeader(items, i) {
  for (let j = i - 1; j >= 0; j--) if (items[j].header) return items[j];
  return null;
}

function byName(a, b) {
  return String(a.name).localeCompare(String(b.name));
}

/** Bezier paths with ports spread along each node's sides, sorted to avoid crossings at the node. */
function routeEdges(edges, boxes, colOf, colIndex) {
  const geo = [];
  for (const e of edges) {
    const a = boxes.get(e.from);
    const b = boxes.get(e.to);
    if (!a || !b) continue;
    let mode;
    if (b.x > a.x + 1) mode = 'right';
    else if (b.x < a.x - 1) mode = 'left';
    else mode = 'loop';
    geo.push({ e, a, b, mode });
  }
  const outPorts = new Map();
  const inPorts = new Map();
  const key = (id, side) => id + '|' + side;
  for (const g of geo) {
    const outSide = g.mode === 'left' ? 'L' : 'R';
    const inSide = g.mode === 'right' ? 'L' : 'R';
    push(outPorts, key(g.e.from, outSide), g);
    push(inPorts, key(g.e.to, inSide), g);
    g.outSide = outSide;
    g.inSide = inSide;
  }
  const spread = (map, which) => {
    for (const [, list] of map) {
      list.sort((p, q) => (which === 'out' ? p.b.y - q.b.y || p.b.x - q.b.x : p.a.y - q.a.y || p.a.x - q.a.x));
      const n = list.length;
      list.forEach((g, i) => {
        const box = which === 'out' ? g.a : g.b;
        const margin = Math.min(14, box.h / 4);
        const y = n === 1 ? box.y + box.h / 2 : box.y + margin + ((box.h - 2 * margin) * i) / (n - 1);
        if (which === 'out') g.sy = y;
        else g.ty = y;
      });
    }
  };
  spread(outPorts, 'out');
  spread(inPorts, 'in');
  const out = [];
  for (const g of geo) {
    const sx = g.outSide === 'R' ? g.a.x + g.a.w : g.a.x;
    const tx = g.inSide === 'L' ? g.b.x : g.b.x + g.b.w;
    const sy = g.sy;
    const ty = g.ty;
    let d;
    if (g.mode === 'loop') {
      const bulge = 46 + Math.min(80, Math.abs(ty - sy) * 0.15);
      d = 'M' + r(sx) + ' ' + r(sy) + ' C' + r(sx + bulge) + ' ' + r(sy) + ' ' + r(tx + bulge) + ' ' + r(ty) + ' ' + r(tx) + ' ' + r(ty);
    } else {
      const dir = g.mode === 'right' ? 1 : -1;
      const dx = Math.max(40, Math.abs(tx - sx) / 2);
      d = 'M' + r(sx) + ' ' + r(sy) + ' C' + r(sx + dir * dx) + ' ' + r(sy) + ' ' + r(tx - dir * dx) + ' ' + r(ty) + ' ' + r(tx) + ' ' + r(ty);
    }
    out.push({ id: g.e.id, from: g.e.from, to: g.e.to, d, sx, sy, tx, ty, mx: (sx + tx) / 2, my: (sy + ty) / 2, mode: g.mode });
  }
  return out;
}

function push(map, k, v) {
  if (!map.has(k)) map.set(k, []);
  map.get(k).push(v);
}

function r(n) {
  return Math.round(n * 10) / 10;
}

// Draws a laid-out view as SVG markup. Used for `--format svg` and, in the browser, by the
// interactive viewer (which then adds pan, zoom and selection on top of the same markup).



const KIND_LABELS = {
  app: 'App', mobile: 'Mobile app', desktop: 'Desktop app', service: 'Service', container: 'Container',
  function: 'Function', worker: 'Worker', cli: 'CLI', library: 'Library', datastore: 'Data store', external: 'Third-party API',
};

const CATEGORY_SINGULAR = {
  database: 'Database', cache: 'Cache', queue: 'Queue / stream', storage: 'Object storage', search: 'Search', vector: 'Vector database',
  auth: 'Auth', payments: 'Payments', email: 'Email', messaging: 'Messaging', ai: 'AI', observability: 'Monitoring',
  analytics: 'Analytics', cms: 'CMS', flags: 'Feature flags', realtime: 'Realtime', workflow: 'Jobs & workflows',
  cloud: 'Cloud API', integrations: 'Integration',
};

const FONT = "system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";

function subtitleOf(node) {
  if (node.unit) {
    const fw = (node.frameworks || []).slice(0, 2).join(' · ');
    return fw || [KIND_LABELS[node.kind], node.language].filter(Boolean).join(' · ');
  }
  if (node.container) return node.image || (node.frameworks || [])[0] || 'Container';
  if (node.custom) return node.description || CATEGORY_SINGULAR[node.category] || KIND_LABELS[node.kind] || '';
  return CATEGORY_SINGULAR[node.category] || KIND_LABELS[node.kind] || '';
}

function escapeXml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function fit(text, px, charW) {
  const max = Math.max(4, Math.floor(px / charW));
  const s = String(text || '');
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

/** CSS used by the map. `mode`: 'auto' (follows OS), 'light', 'dark', or 'external' (variables come from the page). */
function mapCss(mode) {
  const vars = (t) => Object.entries(t).map(([k, v]) => '--sm-' + k + ':' + v + ';').join('');
  let css = '';
  if (mode === 'light' || mode === 'dark') css += '.sm-map{' + vars(THEMES[mode]) + '}';
  else if (mode !== 'external') css += '.sm-map{' + vars(THEMES.light) + '}@media (prefers-color-scheme:dark){.sm-map{' + vars(THEMES.dark) + '}}';
  css +=
    '.sm-map{font-family:' + FONT + '}' +
    '.sm-bg{fill:var(--sm-surface)}' +
    '.sm-col-title{fill:var(--sm-muted);font-size:11px;font-weight:650;letter-spacing:.08em}' +
    '.sm-group{fill:var(--sm-muted);font-size:10.5px;font-weight:600;letter-spacing:.03em}' +
    '.sm-group-line{stroke:var(--sm-hairline);stroke-width:1}' +
    '.sm-edge{fill:none;stroke:var(--sm-edge);stroke-width:1.4;marker-end:url(#sm-arrow)}' +
    '.sm-edge.sm-c-inferred{stroke-dasharray:1.5 4;stroke-linecap:round}' +
    '.sm-edge.sm-declared{stroke-dasharray:5 4}' +
    '.sm-arrow{fill:var(--sm-edge)}' +
    '.sm-arrow-hi{fill:var(--sm-edgeHi)}' +
    '.sm-card{fill:var(--sm-card);stroke:var(--sm-border);stroke-width:1}' +
    '.sm-accent{fill:var(--f)}' +
    '.sm-icon-bg{fill:var(--f);fill-opacity:.15}' +
    '.sm-icon{stroke:var(--f);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}' +
    '.sm-name{fill:var(--sm-ink);font-size:13px;font-weight:600}' +
    '.sm-sub{fill:var(--sm-ink2);font-size:11px}' +
    '.sm-legend{fill:var(--sm-ink2);font-size:11px}' +
    '.sm-credit{fill:var(--sm-muted);font-size:10.5px}' +
    '.sm-title{fill:var(--sm-ink);font-size:15px;font-weight:650}' +
    '.sm-subtitle{fill:var(--sm-muted);font-size:11.5px}' +
    FAMILIES.map((f) => '.sm-f-' + f.key + '{--f:var(--sm-' + f.key + ')}').join('');
  return css;
}

/**
 * @param {{nodes:any[], edges:any[]}} view
 * @param {ReturnType<import('./layout.js').layoutGraph>} layout
 * @param {{ mode?: string, interactive?: boolean, legend?: boolean, credit?: boolean, title?: string, subtitle?: string }} [opts]
 */
function drawSvg(view, layout, opts) {
  const o = opts || {};
  const L = layout.L;
  const legendH = o.legend ? 44 : 0;
  const headH = o.title ? 34 : 0;
  const W = Math.round(layout.width);
  const H = Math.round(layout.height + legendH + headH);
  const byId = new Map(view.nodes.map((n) => [n.id, n]));
  const edgeById = new Map(view.edges.map((e) => [e.id, e]));
  const parts = [];
  const label = o.title ? o.title + ' architecture' : 'Architecture map';
  parts.push(
    '<svg xmlns="http://www.w3.org/2000/svg" class="sm-map" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + escapeXml(label) + '">'
  );
  parts.push('<title>' + escapeXml(label) + '</title>');
  parts.push('<style>' + mapCss(o.mode || 'auto') + '</style>');
  parts.push(
    '<defs>' +
      '<marker id="sm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sm-arrow" d="M0 1.2L9 5 0 8.8z"/></marker>' +
      '<marker id="sm-arrow-hi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sm-arrow-hi" d="M0 1.2L9 5 0 8.8z"/></marker>' +
      '</defs>'
  );
  parts.push('<rect class="sm-bg" x="0" y="0" width="' + W + '" height="' + H + '"/>');
  if (o.title) {
    parts.push('<text class="sm-title" x="' + L.pad + '" y="' + (L.pad + 2) + '">' + escapeXml(o.title) + '</text>');
    if (o.subtitle) parts.push('<text class="sm-subtitle" x="' + L.pad + '" y="' + (L.pad + 20) + '">' + escapeXml(o.subtitle) + '</text>');
  }
  parts.push('<g transform="translate(0,' + headH + ')">');

  for (const c of layout.columns) {
    parts.push('<text class="sm-col-title" x="' + c.x + '" y="' + (L.pad + 14) + '">' + escapeXml(c.title.toUpperCase()) + ' · ' + c.count + '</text>');
  }
  for (const g of layout.groups) {
    const ty = g.y + 13;
    parts.push('<text class="sm-group" x="' + g.x + '" y="' + ty + '">' + escapeXml(g.label) + '</text>');
    parts.push('<line class="sm-group-line" x1="' + g.x + '" x2="' + (g.x + g.w) + '" y1="' + (g.y + L.headerH - 5) + '" y2="' + (g.y + L.headerH - 5) + '"/>');
  }

  parts.push('<g class="sm-edges">');
  for (const ge of layout.edges) {
    const e = edgeById.get(ge.id);
    const cls = 'sm-edge sm-c-' + e.confidence + (e.declaredOnly ? ' sm-declared' : '');
    const tip = (byId.get(e.from) || {}).name + ' → ' + (byId.get(e.to) || {}).name + (e.via && e.via.length ? ' (' + e.via.join(', ') + ')' : '');
    if (o.interactive) {
      parts.push('<path class="sm-hit" d="' + ge.d + '" data-id="' + escapeXml(e.id) + '" fill="none" stroke="transparent" stroke-width="12"/>');
    }
    parts.push('<path class="' + cls + '" d="' + ge.d + '" data-id="' + escapeXml(e.id) + '" data-from="' + escapeXml(e.from) + '" data-to="' + escapeXml(e.to) + '"><title>' + escapeXml(tip) + '</title></path>');
  }
  parts.push('</g><g class="sm-nodes">');

  const textW = L.nodeW - 58;
  for (const n of view.nodes) {
    const b = layout.boxes.get(n.id);
    if (!b) continue;
    const fam = familyOf(n);
    const sub = subtitleOf(n);
    parts.push(
      '<g class="sm-node sm-f-' + fam + '" data-id="' + escapeXml(n.id) + '" transform="translate(' + b.x + ',' + b.y + ')"' + (o.interactive ? ' tabindex="0" role="button" aria-label="' + escapeXml(n.name + ', ' + sub) + '"' : '') + '>' +
        '<title>' + escapeXml(n.name + (sub ? ' — ' + sub : '')) + '</title>' +
        '<rect class="sm-card" width="' + b.w + '" height="' + b.h + '" rx="10"/>' +
        '<rect class="sm-accent" x="0" y="10" width="3.5" height="' + (b.h - 20) + '" rx="1.75"/>' +
        '<rect class="sm-icon-bg" x="12" y="' + (b.h / 2 - 15) + '" width="30" height="30" rx="8"/>' +
        '<g class="sm-icon" transform="translate(17,' + (b.h / 2 - 10) + ') scale(0.8333)">' + iconFor(n) + '</g>' +
        '<text class="sm-name" x="52" y="' + (sub ? b.h / 2 - 3 : b.h / 2 + 4.5) + '">' + escapeXml(fit(n.name, textW, 7.3)) + '</text>' +
        (sub ? '<text class="sm-sub" x="52" y="' + (b.h / 2 + 13) + '">' + escapeXml(fit(sub, textW, 6.1)) + '</text>' : '') +
        '</g>'
    );
  }
  parts.push('</g>');
  parts.push('</g>');

  if (o.legend) {
    const y = H - legendH + 16;
    let x = L.pad;
    const used = new Set(view.nodes.map(familyOf));
    for (const f of FAMILIES) {
      if (!used.has(f.key)) continue;
      parts.push('<g class="sm-f-' + f.key + '"><rect class="sm-accent" x="' + x + '" y="' + (y - 9) + '" width="10" height="10" rx="2.5"/></g>');
      parts.push('<text class="sm-legend" x="' + (x + 15) + '" y="' + y + '">' + escapeXml(f.label) + '</text>');
      x += 26 + f.label.length * 6.4;
    }
    x += 14;
    const lines = [['sm-edge sm-c-imported', 'used in code'], ['sm-edge sm-c-declared sm-declared', 'declared, no import found'], ['sm-edge sm-c-inferred', 'inferred']];
    for (const [cls, text] of lines) {
      parts.push('<path class="' + cls + '" d="M' + x + ' ' + (y - 4) + 'h26" style="marker-end:none"/>');
      parts.push('<text class="sm-legend" x="' + (x + 33) + '" y="' + y + '">' + escapeXml(text) + '</text>');
      x += 50 + text.length * 6.2;
    }
    if (o.credit !== false) {
      parts.push('<text class="sm-credit" x="' + (W - L.pad) + '" y="' + y + '" text-anchor="end">Made with Stackmap</text>');
    }
  }
  parts.push('</svg>');
  return parts.join('');
}

// The interactive viewer. Runs in the browser, inlined into one self-contained HTML file

(function () {

  var hasLibraries = graph.nodes.some(function (n) { return n.kind === 'library'; });

  var $ = function (sel) { return document.querySelector(sel); };

  var canvas = $('#canvas');
  var panel = $('#panel');

  var state = { libraries: false, selected: null, selectedEdge: null, hover: null, query: '', x: 0, y: 0, k: 1 };

  var bits = [];
  if (s.apps) bits.push(plural(s.apps, 'app'));
  if (s.services) bits.push(plural(s.services, 'service'));
  if (s.workers) bits.push(plural(s.workers, 'worker'));
  if (s.datastores) bits.push(plural(s.datastores, 'data store'));
  if (s.external) bits.push(s.external + ' third-party');

  $('#meta').textContent = 'Stackmap ' + graph.tool.version + (project.commit ? ' · ' + project.commit.slice(0, 7) : '') + ' · ' + graph.summary.ms + ' ms';

  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  function applyHighlight() {

      keep = neighbours(view, focus);

    inferred: ['inferred', 'Inferred from naming, such as an API_URL env var. Check before relying on it.'],

  function esc(t) { return escapeXml(t); }

  function relRow(e, otherId, dir) {

      (e.through || []).slice(0, 2).map(function (t) { return '<span class="chip">through ' + esc(t) + '</span>'; }).join('') +

  function showNode(n) {

    var inc = view.edges.filter(function (e) { return e.to === n.id; });
    var h = '<div class="p-head">' + iconBox(n) + '<div><div class="p-title">' + esc(n.name) + '</div><div class="p-kind">' + esc(kindLabel(n)) + '</div></div><button class="btn p-close" aria-label="Close" data-close>✕</button></div>';
    if (n.description) h += '<p class="p-desc">' + esc(n.description) + '</p>';
    if (n.path) h += '<div class="mono" style="color:var(--sm-ink2)">' + esc(n.path) + (n.packageName && n.packageName !== n.name ? ' · ' + esc(n.packageName) : '') + '</div>';
    var chips = (n.frameworks || []).map(function (f) { return '<span class="chip">' + esc(f) + '</span>'; }).concat((n.platforms || []).map(function (p) { return '<span class="chip">deploys: ' + esc(p) + '</span>'; }));
    if (chips.length) h += '<div class="chips">' + chips.join('') + '</div>';
    if (n.url) h += '<div style="margin-top:6px"><a href="' + esc(n.url) + '" target="_blank" rel="noopener">' + esc(n.url.replace(/^https?:\/\//, '')) + '</a></div>';
    if (out.length) h += '<h3>' + (n.unit || n.container ? 'Talks to' : 'Depends on') + ' · ' + out.length + '</h3><ul class="rel">' + out.map(function (e) { return relRow(e, e.to); }).join('') + '</ul>';
    if (inc.length) h += '<h3>Used by · ' + inc.length + '</h3><ul class="rel">' + inc.map(function (e) { return relRow(e, e.from); }).join('') + '</ul>';
    if (!n.unit) {

      var names = [];
      imp.forEach(function (v, id) { var x = byIdAll.get(id); if (x && x.kind !== 'library') names.push(x.name); });
      if (names.length) h += '<h3>If ' + esc(n.name) + ' is down</h3><div class="note">' + names.length + ' part' + (names.length === 1 ? '' : 's') + ' of the system depend on it, directly or through other parts: ' + names.slice(0, 12).map(esc).join(', ') + (names.length > 12 ? ', …' : '') + '</div>';
    }
    h += '<h3>Why it is on the map</h3>' + evidenceList(n.evidence, n.evidenceCount);
    if (n.env && n.env.length) h += '<h3>Reads env vars · ' + n.env.length + '</h3><div class="env">' + n.env.map(function (v) { return '<code>' + esc(v) + '</code>'; }).join('') + '</div>';

  function showEdge(e) {
    if (!e) return;

    var b = byId.get(e.to);
    var c = CONF[e.confidence] || CONF.declared;
    var h = '<div class="p-head"><div><div class="p-title">' + esc(a.name) + ' → ' + esc(b.name) + '</div><div class="p-kind">' + esc(e.kind) + '</div></div><button class="btn p-close" aria-label="Close" data-close>✕</button></div>';
    h += '<div class="chips"><span class="chip c-' + e.confidence + '">' + c[0] + '</span>' + (e.via || []).map(function (v) { return '<span class="chip">' + esc(v) + '</span>'; }).join('') + '</div>';
    h += '<div class="note">' + c[1] + (e.declaredOnly ? ' No runtime import was found, so it may be unused.' : '') + '</div>';
    if (e.through && e.through.length) h += '<div class="note">Through internal ' + (e.through.length === 1 ? 'library' : 'libraries') + ': ' + e.through.map(esc).join(', ') + '. Switch to “Everything” to see them.</div>';
    h += '<h3>Evidence</h3>' + evidenceList(e.evidence, e.evidenceCount);

  }
  function openPanel(html) {
    panel.innerHTML = html;
    panel.hidden = false;
    panel.scrollTop = 0;
  }
  panel.addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go) {

    }

    if (e.key === '/') { e.preventDefault(); search.focus(); }
    else if (e.key === 'Escape') clearSelection();
    else if (e.key === 'f' || e.key === '0') fit();
    else if (e.key === '+' || e.key === '=') zoomCenter(1.25);
    else if (e.key === '-') zoomCenter(0.8);
  });
  function zoomCenter(f) { var r = stage.getBoundingClientRect(); zoomAt(f, r.width / 2, r.height / 2); }
  $('#zin').addEventListener('click', function () { zoomCenter(1.25); });
  $('#zout').addEventListener('click', function () { zoomCenter(0.8); });
  $('#zfit').addEventListener('click', fit);
  document.querySelectorAll('#viewseg button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.libraries = b.getAttribute('data-view') === 'all';
      document.querySelectorAll('#viewseg button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
      fit();
      hint(state.libraries ? 'Showing internal libraries' : 'Libraries folded into the apps that use them');
    });
  });

  // ------------------------------------------------------------------ export
  function download(name, type, data) {
    var blob = data instanceof Blob ? data : new Blob([data], { type: type });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function fileBase() { return String(project.name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-stackmap'; }
  function standaloneSvg() {
    return drawSvg(view, layout, { mode: currentTheme(), legend: true, title: project.name, subtitle: $('#stats').textContent });
  }
  function closeMenu() { $('#exportmenu').removeAttribute('open'); }
  $('#ex-svg').addEventListener('click', function () { download(fileBase() + '.svg', 'image/svg+xml', standaloneSvg()); closeMenu(); });
  $('#ex-png').addEventListener('click', function () {
    var markup = standaloneSvg();
    var img = new Image();
    var w = Number(markup.match(/width="(\d+)"/)[1]);
    var h = Number(markup.match(/height="(\d+)"/)[1]);
    img.onload = function () {
      var scale = Math.min(2, 8000 / Math.max(w, h));
      var c = document.createElement('canvas');
      c.width = Math.round(w * scale);
      c.height = Math.round(h * scale);
      var ctx = c.getContext('2d');
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob(function (blob) { download(fileBase() + '.png', 'image/png', blob); });
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(markup);
    closeMenu();
  });
  $('#ex-mmd').addEventListener('click', function () {
    var text = state.libraries ? DATA.mermaid.everything : DATA.mermaid.services;
    var done = function () { toast('Mermaid copied. Paste it into a ```mermaid block'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { download(fileBase() + '.mmd', 'text/plain', text); });
    else download(fileBase() + '.mmd', 'text/plain', text);
    closeMenu();
  });
  $('#ex-json').addEventListener('click', function () { download(fileBase() + '.json', 'application/json', JSON.stringify(graph, null, 2)); closeMenu(); });
  document.addEventListener('click', function (e) { if (!e.target.closest('#exportmenu')) closeMenu(); });

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }
  var hintTimer;
  function hint(msg) {
    var t = $('#hint');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }

  // ------------------------------------------------------------------ start
  render();
  fit();
  window.addEventListener('resize', function () { fit(); });
  var start = location.hash.slice(1);
  if (start) {
    var target = graph.nodes.find(function (n) { return n.name === decodeURIComponent(start) || n.id === decodeURIComponent(start); });
    if (target && byId.has(target.id)) selectNode(target.id, { center: true });
  }
})();

</script>
</body>
</html>
