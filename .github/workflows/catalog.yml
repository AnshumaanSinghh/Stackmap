name: Catalog

# Every package name in the technology catalog must exist in its registry.
# Runs weekly to catch renamed or removed packages, and on changes to the catalog.

on:
  schedule:
    - cron: "17 5 * * 1"
  pull_request:
    paths: [src/catalog/**, scripts/verify-catalog.js]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/verify-catalog.js
